services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dsm_api
      POSTGRES_USER: dsm
      POSTGRES_PASSWORD: dsm_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsm -d dsm_api"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://dsm:dsm_password@postgres:5432/dsm_api
      ADMIN_TOKEN: change-me
      EMBEDDINGS_ENABLED: "false"
      EMBEDDINGS_REQUIRED: "false"
      DSM_RELEASE_ROOT: /app/data/dsm/releases
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  postgres_data:
